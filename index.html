*{box-sizing:border-box}body{margin:0;background:#edf2fa;color:#15233b;font:19px/1.6 system-ui,sans-serif}header{background:#102a63;color:white;padding:15px;text-align:center;font-weight:800;font-size:15px;letter-spacing:.5px;border-bottom:5px solid #ffca28}main{max-width:850px;margin:auto;padding:20px 16px 110px}h1{font-size:clamp(30px,7vw,48px);line-height:1.13;margin:12px 0}h2{font-size:27px;line-height:1.2}h3{font-size:22px;margin:0 0 8px;color:#123b8c}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:700}button:focus-visible{outline:3px solid #f59e0b}button:disabled{opacity:.4;cursor:default}.hero{background:#123b8c;color:white;padding:28px;border-radius:22px}.hero strong{color:#ffda45}.index{display:grid;gap:10px;margin-top:20px}.index button{text-align:left;background:white;color:#123b8c;box-shadow:0 2px 8px #123b8c15}.num{display:inline-block;background:#ffcf33;color:#102a63;padding:2px 10px;border-radius:8px;margin-right:8px}.panel{background:white;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 3px 14px #132c5510}.opt{display:block;width:100%;text-align:left;margin:10px 0;background:#eaf1ff;color:#162e60;border:2px solid transparent}.opt.right{background:#d5f8df;border-color:#159447;color:#075c29}.opt.wrong{background:#ffe0e0;border-color:#d32f2f;color:#8a1616}.tag{font-size:14px;font-weight:800;letter-spacing:1px;color:#2453a0}.answer{background:#0a7546;color:white;border-radius:12px;padding:16px;font-weight:800}.paper{background:repeating-linear-gradient(white,white 31px,#e2eaf5 32px,white 33px);border-left:5px solid #e83c61}.diagram{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 0}.node{border:2px solid #1c55bc;background:#eaf2ff;color:#103b83;border-radius:12px;padding:14px;text-align:center;font-weight:800;width:min(100%,540px)}.node:last-child{background:#fff1a9;border-color:#e2ad00;color:#513b00}.arrow{color:#e15b16;font-size:32px;line-height:1}.tip{background:#fff2b8;border-left:6px solid #f4b400}.nav{position:fixed;bottom:0;left:0;right:0;background:#102a63;display:flex;justify-content:center;gap:8px;padding:10px 8px max(10px,env(safe-area-inset-bottom));z-index:5}.nav button{background:#ffcf33;color:#102a63;font-size:15px;padding:12px}.primary{background:#123b8c;color:white;width:100%}.progress{height:8px;background:#dce5f6;border-radius:10px;overflow:hidden}.progress div{background:#f3b700;height:100%}.muted{color:#52637d;font-size:15px}.wrongline{margin:9px 0;border-bottom:1px solid #e5eaf2;padding-bottom:9px} @media print{.nav{display:none}}
</style><header>CURSO DE CONTABILIDADE PROFESSOR MOREIRA</header><main id="app"></main><nav class="nav"><button onclick="go(-1)">‹ Voltar</button><button onclick="home()">☰ Índice</button><button onclick="go(1)">Avançar ›</button></nav><script>
const Q=[{"n": 1, "t": "Conceitos Básicos Da Contabilidade", "q": "Uma entidade apresenta passivo a descoberto. Em relação à equação fundamental nesta entidade, assinale a opção correta.", "opts": ["Passivo = Patrimônio Líquido – Ativo.", "Passivo = Ativo + Patrimônio Líquido.", "Patrimônio Líquido = Ativo + Passivo.", "Ativo = Patrimônio Líquido – Passivo.", "Ativo + Passivo + Patrimônio Líquido = 0."], "g": "B", "rule": "Passivo a descoberto significa que as obrigações superam os ativos. A equação geral é A = P + PL, com PL negativo. A alternativa B usa o valor absoluto do déficit, não o PL com sinal contábil.", "diagram": "Ativo 80 → Passivo 120 → PL = 80 − 120 = −40 → Passivo = 80 + 40 (déficit)", "example": "Imagine vender todos os bens por 80: ainda faltariam 40 para pagar as dívidas de 120. Com sinal algébrico, P = A − PL = 80 − (−40). A redação da banca é imprecisa: B só funciona se PL representar a magnitude do déficit.", "wrong": "A: inverte a relação; C: PL é diferença, não soma; D: troca os sinais; E: a soma algébrica correta é A − P − PL = 0.", "tip": "PL negativo: passivo maior que ativo. Não memorize B sem a ressalva do sinal."}, {"n": 2, "t": "Fatos Contábeis", "q": "Os fatos contábeis podem ser permutativos, modificativos ou mistos, a depender do seu efeito patrimonial. Um exemplo de fato contábil modificativo é o registro do(a):", "opts": ["aquisição de móveis e utensílios;", "compra de materiais para estoque;", "depreciação de um veículo;", "pagamento do principal de uma dívida;", "recebimento por vendas a prazo."], "g": "C", "rule": "Fato modificativo altera o patrimônio líquido. A depreciação reconhece o consumo do potencial de serviço do veículo como despesa, quando não integra o custo de outro ativo.", "diagram": "Veículo 50.000 → Depreciação 5.000 → Valor líquido 45.000 → Resultado e PL diminuem 5.000", "example": "D: Despesa de depreciação 5.000; C: Depreciação acumulada 5.000. O caixa não muda. O ativo líquido e o PL diminuem igualmente.", "wrong": "A: aquisição troca ativos ou cria obrigação; B: compra de estoque não é despesa imediata; D: principal reduz caixa e dívida; E: recebimento troca clientes por caixa.", "tip": "Modificativo diminutivo = redução do PL sem distribuição aos sócios."}, {"n": 3, "t": "Escrituração E Partidas Dobradas", "q": "Os lançamentos contábeis são realizados a partir de contas patrimoniais e de resultado, que possuem objetivos e naturezas diferentes na composição das demonstrações contábeis. Em se tratando de uma despesa paga à vista, o lançamento a crédito deve ser feito em uma conta de:", "opts": ["ativo;", "passivo;", "resultado;", "fornecedores;", "patrimônio líquido."], "g": "A", "rule": "Na despesa paga à vista, a conta de despesa aumenta a débito e o caixa diminui a crédito. Caixa pertence ao ativo e tem natureza devedora.", "diagram": "Despesa de energia 300 → D: Energia 300 | C: Caixa 300 → Ativo −300 | PL −300", "example": "Caixa inicial 2.000, saída 300, saldo 1.700. A despesa aparece na DRE e reduz o lucro. Débito não significa necessariamente saída de dinheiro.", "wrong": "B: não há obrigação pendente; C: despesa é debitada; D: fornecedores não é usado no pagamento imediato; E: PL é afetado indiretamente pelo resultado.", "tip": "Despesa aumenta a débito; saída de caixa é crédito."}, {"n": 4, "t": "Balanço Patrimonial", "q": "Uma entidade que presta serviços contábeis adquiriu ações integrantes do capital social de outra sociedade, com o intuito de valorização. Em seu balanço patrimonial, essas ações são contabilizadas no ativo como", "opts": ["circulante.", "intangível.", "imobilizado.", "investimento.", "realizável a longo prazo."], "g": "D", "rule": "A banca considera a participação societária mantida com intenção de valorização como investimento permanente. A classificação efetiva depende da finalidade, prazo e natureza da participação, conforme Lei 6.404 e CPC 48.", "diagram": "Caixa 20.000 → Compra de ações 20.000 → Participação permanente: ANC – Investimentos", "example": "D: Investimentos 20.000; C: Caixa 20.000. Não há despesa na compra. Se as ações forem mantidas para negociação de curto prazo, podem ser circulantes; se não permanentes e de longo prazo, podem ser realizável a longo prazo. O enunciado não explicita o prazo.", "wrong": "A: possível em negociação de curto prazo, não na leitura da banca; B: ação é ativo financeiro; C: não é bem operacional corpóreo; E: possível para aplicação não permanente de longo prazo.", "tip": "Intenção de permanência é decisiva; valorização isoladamente não define o grupo."}, {"n": 5, "t": "Estrutura Conceitual (Cpc 00)", "q": "Um analista preparou a análise horizontal de cinco anos do balanço patrimonial de uma sociedade empresária. Este posicionamento vincula-se, na essência, à seguinte característica qualitativa de melhoria de informações financeiras úteis:", "opts": ["materialidade.", "tempestividade.", "verificabilidade.", "comparabilidade.", "compreensibilidade."], "g": "D", "rule": "Comparabilidade permite identificar semelhanças e diferenças entre períodos ou entidades. Análise horizontal mede a evolução de uma mesma conta ao longo do tempo.", "diagram": "Ano 1: 100 → Ano 2: 120 → Ano 3: 150 → Crescimento acumulado: 50%", "example": "Índice horizontal = valor do período ÷ valor-base × 100. Ano 3: 150 ÷ 100 × 100 = 150%; aumento de 50%. Consistência dos critérios ajuda a comparação.", "wrong": "A: materialidade é aspecto da relevância; B: informação disponível a tempo; C: possibilidade de verificação independente; E: apresentação clara e compreensível.", "tip": "Horizontal = comparação no tempo; vertical = participação no total."}, {"n": 6, "t": "Demonstração Do Resultado (Dre)", "q": "As opções a seguir trazem exemplos de informações que são apresentadas na Demonstração do Resultado do Exercício de uma entidade, à exceção de uma. Assinale-a:", "opts": ["Devolução de vendas.", "Provisão para imposto sobre a renda.", "Resultado de operações descontinuadas.", "Variação cambial.", "Distribuição de dividendos."], "g": "E", "rule": "Dividendos são distribuição do lucro aos proprietários, não despesa. A DRE apura o resultado antes da destinação aos sócios.", "diagram": "Receitas 100.000 → Despesas 70.000 → Lucro 30.000 → Dividendos 10.000: destinação do PL", "example": "Ao reconhecer dividendos exigíveis: D: Lucros acumulados 10.000; C: Dividendos a pagar 10.000. Ao pagar: D: Dividendos a pagar; C: Caixa. Nenhum dos dois reduz o lucro da DRE.", "wrong": "A: dedução de vendas; B: tributo sobre lucro afeta resultado; C: resultado descontinuado é apresentado separadamente; D: variação cambial normalmente afeta resultado, ressalvadas hipóteses específicas.", "tip": "Distribuir lucro não é gerar despesa."}, {"n": 7, "t": "Regime De Competência E Caixa", "q": "Assinale a opção que indica uma situação em que o reconhecimento da receita ou da despesa pelos Regimes de Caixa e de Competência acontecem no mesmo momento.", "opts": ["Integralização de capital social pelos sócios em dinheiro.", "Pagamento das despesas de salários relativas ao mês anterior.", "Compra à vista de passagem aérea para viagem em 90 dias.", "Pagamento de encomenda de um móvel que será entregue em 60 dias.", "Pagamento de mensalidade do mês corrente de um curso que tem duração de 2 anos."], "g": "E", "rule": "Competência reconhece receita ou despesa quando ocorre o fato econômico; caixa considera recebimento ou pagamento. Os momentos coincidem quando o serviço do mês é consumido e pago no mesmo mês.", "diagram": "Mês corrente → Aula prestada + mensalidade paga → Competência e caixa no mesmo período", "example": "Mensalidade 500: para o aluno, despesa do mês e pagamento 500. Para a escola, receita do serviço prestado e recebimento 500. O prazo total do curso não muda a análise da mensalidade corrente.", "wrong": "A: capital não é receita; B: despesa pertence ao mês anterior; C: passagem para uso futuro; D: adiantamento por móvel ainda não entregue.", "tip": "Compare a data do fato gerador com a data do dinheiro."}, {"n": 8, "t": "Estoques (Cpc 16)", "q": "Assinale a opção que indica exemplo de itens que não são incluídos no custo dos estoques, de acordo com o Pronunciamento Técnico CPC 16 (R1) - Estoques.", "opts": ["Custos com seguro.", "Custos de transporte.", "Imposto de importação.", "Valor anormal de desperdício de materiais.", "Tributos não recuperáveis junto ao FISCO."], "g": "D", "rule": "CPC 16 inclui custos necessários para trazer estoques à localização e condição atuais. Desperdício anormal é reconhecido como despesa, não incorporado ao estoque.", "diagram": "Mercadoria 10.000 + frete 500 + seguro 200 + tributo não recuperável 300 → Estoque 11.000 → Desperdício anormal 800: resultado", "example": "Se houver perda anormal de material de 800, reconheça a perda no resultado, com baixa do material correspondente. Tributos recuperáveis são excluídos do custo.", "wrong": "A: seguro de aquisição integra custo; B: transporte de aquisição integra; C: imposto de importação integra; E: tributo não recuperável integra.", "tip": "Anormal = despesa. Necessário à aquisição = custo."}, {"n": 9, "t": "Peps E Custo Médio", "q": "Uma empresa comercial decidiu mudar seu método de avaliação de estoque de \"PEPS\" para \"UEPS\" em um período de alta de custos. Nesse sentido, considerando- se as informações apresentadas, o resultado da mudança no estoque final e no lucro líquido são:", "opts": ["mesmo valor do estoque final e aumento do lucro líquido;", "aumento do estoque final e diminuição do lucro líquido;", "diminuição do estoque final e aumento do lucro líquido;", "aumento do estoque final e aumento do lucro líquido;", "diminuição do estoque final e diminuição do lucro líquido."], "g": "E", "rule": "Com preços crescentes, PEPS baixa primeiro os custos antigos, mais baratos; UEPS baixa primeiro os custos recentes, mais caros. UEPS não é admitido pelo CPC 16 para demonstrações contábeis.", "diagram": "Compra 1: 10 unidades × 10 → Compra 2: 10 unidades × 20 → Venda 10 unidades por 300 → PEPS: CMV 100 / EF 200 | UEPS: CMV 200 / EF 100", "example": "Receita 300: lucro bruto PEPS 200; UEPS 100. Mantidas as demais condições, o lucro líquido também diminui. O estoque final cai de 200 para 100.", "wrong": "A: estoque e lucro mudam; B: estoque não aumenta; C: lucro não aumenta; D: ambos diminuem, não aumentam.", "tip": "Alta de preços: UEPS aumenta CMV e reduz estoque e lucro."}, {"n": 10, "t": "Ativo Imobilizado (Cpc 27)", "q": "Em uma sociedade empresária, são classificados(as) como “Ativo Imobilizado em Andamento”", "opts": ["os melhoramentos e as obras integradas aos terrenos utilizados.", "os bens incorpóreos destinados à manutenção das atividades.", "as peças destinadas à substituição em máquinas e equipamentos.", "os bens utilizados para deslocamento de pessoal ou transporte de mercadorias.", "os bens em uso durante a fase pré-operacional, relativos ao desenvolvimento de um projeto."], "g": "E", "rule": "Imobilizado em andamento reúne custos de ativos ainda em implantação, construção ou preparação. A banca enquadra os bens vinculados à fase pré-operacional do projeto nessa categoria.", "diagram": "Projeto em implantação → Obras e equipamentos em montagem → Disponível para uso → Imobilizado em operação", "example": "Construção 100.000 + instalação 20.000 = 120.000 em andamento. Quando disponível para uso, transfere-se para a classe definitiva e começa a depreciação. Atenção: bens já disponíveis para uso devem ser depreciados mesmo na fase pré-operacional; gastos pré-operacionais genéricos não são automaticamente ativados.", "wrong": "A: benfeitorias utilizadas são imobilizado em operação; B: bens incorpóreos podem ser intangíveis; C: peças podem ser estoque ou imobilizado conforme critérios; D: veículos utilizados estão em operação.", "tip": "Disponível para uso é o marco da depreciação, não a inauguração da empresa."}, {"n": 11, "t": "Depreciação E Amortização", "q": "Em relação ao reconhecimento do uso de ativos, assinale a opção correta.", "opts": ["Um direito autoral sofre depreciação.", "Uma floresta sofre amortização.", "Uma reserva de petróleo sofre exaustão.", "Uma obra de arte sofre depreciação.", "O terreno da sede da empresa sofre exaustão."], "g": "C", "rule": "Exaustão corresponde ao consumo de recursos naturais pela exploração. Depreciação é típica de bens tangíveis de vida útil limitada; amortização, de intangíveis de vida útil definida.", "diagram": "Máquina → Depreciação | Direito autoral → Amortização | Petróleo → Exaustão", "example": "Reserva explorável de 100.000 barris com custo atribuível de 500.000: custo unitário 5. Extração de 10.000 barris gera exaustão de 50.000, observadas as regras aplicáveis.", "wrong": "A: direito autoral de vida definida é amortizado; B: floresta não é amortizada (tratamento depende do CPC 29 e da natureza); D: obra de arte geralmente não sofre depreciação se vida útil ilimitada; E: terreno comum não é recurso mineral explorado.", "tip": "Petróleo e jazidas: pense em exaustão."}, {"n": 12, "t": "Ativo Intangível (Cpc 04)", "q": "No balanço patrimonial, uma classe de ativos intangíveis constitui um grupo de ativos de natureza e com utilização similar nas atividades da entidade. Assinale a opção que indica ativos intangíveis classificados na mesma classe.", "opts": ["Licenças e franquias.", "Softwares e patentes.", "Marcas e títulos de periódicos.", "Direitos de propriedade industrial e protótipos.", "Direitos autorais e ativos intangíveis em desenvolvimento."], "g": "A", "rule": "O CPC 04 agrupa intangíveis de natureza e utilização semelhantes. Licenças e franquias são exemplos de uma mesma classe prevista na norma.", "diagram": "Ativo intangível → Licenças e franquias | Marcas | Softwares | Direitos autorais e patentes | Intangíveis em desenvolvimento", "example": "Uma franquia de 60.000 com vida útil de 5 anos, sem residual, pode gerar amortização anual de 12.000 pelo método linear se refletir o consumo. A classe serve à apresentação e divulgação, não determina sozinha a vida útil.", "wrong": "B: softwares e patentes são classes distintas; C: marcas e títulos de publicações são exemplos separados; D: protótipos não compõem necessariamente a classe de direitos industriais; E: ativos em desenvolvimento são classe distinta.", "tip": "Memorize o par licenças e franquias."}, {"n": 13, "t": "Impairment (Cpc 01)", "q": "Uma empresa operacional possui investimentos em controladas que atuam em diversos setores econômicos. Esta investidora está se preparando para realizar o teste da recuperabilidade de suas participações societárias. Assinale o investimento que tem maior probabilidade de reconhecimento do teste de recuperabilidade.", "opts": ["a Cia Alfa está em fase pré-operacional.", "a Cia Beta não distribuiu dividendos obrigatórios nos últimos três anos.", "a Cia Gama comprou participação societária na Cia Penta e pagou Goodwill.", "a Cia Delta vendeu a participação societária na Cia Zeta.", "a Cia Epsilon comprou participação societária na Cia Sigma e não pagou Goodwill."], "g": "B", "rule": "A ausência reiterada de dividendos obrigatórios pode sinalizar dificuldades financeiras da investida e justificar investigação de recuperabilidade. Não prova, por si só, uma perda.", "diagram": "Investida Beta: 3 anos sem dividendos → Investigar indicadores → Comparar valor contábil e recuperável → Reconhecer perda se necessário", "example": "Participação contabilizada por 500.000; recuperável 420.000: perda 80.000. D: Perda por impairment; C: Ajuste redutor do investimento. O CPC 01 também considera indicadores específicos ligados a dividendos e valores contábeis.", "wrong": "A: fase pré-operacional não prova perda; C: aquisição com goodwill não demonstra perda da participação; D: venda isolada não comprova perda; E: aquisição sem goodwill não é indicador por si só.", "tip": "Indicador de perda não é perda automática. Valor recuperável deve ser estimado."}, {"n": 14, "t": "Clientes E Pecld", "q": "Em 31/12/2022, uma sociedade empresária apresentava em seu balanço patrimonial um saldo de R$43.200 na conta “Clientes”. A composição da conta era a seguinte: Contas a receber de clientes: R$45.000; Perdas estimadas com crédito de liquidação duvidosa: (R$1.800). Em janeiro de 2023, todos os clientes pagaram o que deviam. O recebimento trouxe um aumento no Resultado de", "opts": ["zero.", "R$1.800.", "R$43.200.", "R$45.000.", "R$46.800."], "g": "B", "rule": "O recebimento integral elimina a necessidade da perda estimada de 1.800. A receita da venda já foi reconhecida anteriormente; apenas a reversão aumenta o resultado agora.", "diagram": "Clientes bruto 45.000 − PECLD 1.800 = 43.200 → Recebimento 45.000 → Reversão 1.800 → Resultado +1.800", "example": "1) D: Caixa 45.000; C: Clientes 45.000. 2) D: PECLD (redutora) 1.800; C: Reversão de perdas 1.800. Antes: ativo líquido 43.200; depois: caixa 45.000. Diferença 1.800.", "wrong": "A: ignora reversão; C: é saldo líquido anterior; D: é recebimento, não receita nova; E: soma indevidamente recebimento e reversão.", "tip": "Receber clientes não gera nova receita; reverter perda aumenta resultado."}, {"n": 15, "t": "Despesas Antecipadas", "q": "Em 01/04/2017, uma entidade pagou antecipadamente o seguro de seus veículos com vigência de quatro anos, no valor de R$ 96.000, com início de utilização imediata. Assinale a opção que indica a contabilização da despesa antecipada com seguro no Balanço patrimonial da entidade, em 31/12/2017.", "opts": ["Ativo Circulante: R$ 18.000 / Ativo não Circulante: R$ 78.000.", "Ativo Circulante: R$ 24.000 / Ativo não Circulante: R$ 54.000.", "Ativo Circulante: R$ 24.000 / Ativo não Circulante: R$ 72.000.", "Ativo Circulante: R$ 42.000 / Ativo não Circulante: R$ 54.000.", "Ativo Circulante: 0 / Ativo não Circulante: R$ 78.000."], "g": "B", "rule": "Seguro antecipado é ativo enquanto a cobertura não foi consumida. Em 31/12/2017, separam-se os próximos 12 meses dos períodos posteriores.", "diagram": "01/04/2017: 96.000 por 48 meses → 9 meses consumidos × 2.000 = 18.000 → Saldo 78.000 → AC 12 × 2.000 = 24.000 | ANC 27 × 2.000 = 54.000", "example": "D: Seguros antecipados 96.000; C: Caixa 96.000. Até dezembro: D: Despesa de seguros 18.000; C: Seguros antecipados 18.000. Linha do tempo: abr–dez/2017 = 9 meses; jan–dez/2018 = 12; jan/2019–mar/2021 = 27. Total 48.", "wrong": "A: 18.000 é despesa consumida; C: não baixa os 18.000; D: soma despesa consumida ao circulante; E: ignora cobertura dos próximos 12 meses.", "tip": "Primeiro retire o consumido; depois separe 12 meses e o restante."}, {"n": 16, "t": "Provisões E Contingências", "q": "Em relação às provisões, assinale a afirmativa correta.", "opts": ["Apresentam valor ou prazo incertos.", "Derivam de eventos que irão ocorrer.", "Devem ser contabilizadas no passivo circulante.", "Devem ser contabilizadas como redutoras do ativo.", "Sua existência será confirmada pela ocorrência de eventos futuros, que estão sob o controle da entidade."], "g": "A", "rule": "Provisão, segundo CPC 25, é passivo de prazo ou valor incerto. Reconhecimento exige obrigação presente de evento passado, saída provável e estimativa confiável.", "diagram": "Evento passado → Obrigação presente → Saída provável + estimativa confiável → Provisão no passivo", "example": "Processo judicial com perda provável de 30.000: D: Despesa 30.000; C: Provisão 30.000. Se saída apenas possível, em regra divulga-se passivo contingente; se remota, em regra nem divulgação.", "wrong": "B: obrigação decorre de evento passado; C: pode ser circulante ou não circulante; D: provisão CPC 25 é passivo; E: confunde obrigação possível com provisão e eventos não totalmente controlados.", "tip": "Provisão = passivo com incerteza de prazo ou valor."}, {"n": 17, "t": "Demonstração Dos Fluxos De Caixa", "q": "Uma sociedade empresária elabora a sua demonstração dos fluxos de caixa pelo método indireto. Assinale a opção que indica um fato que pode ser apresentado nesta demonstração, como ajuste ao lucro líquido.", "opts": ["compra de ativo imobilizado a prazo.", "resgate de títulos de valores mobiliários.", "integralização de capital social com terrenos.", "despesa de depreciação do ativo imobilizado.", "pagamento de dividendos aos acionistas por meio de imóveis."], "g": "D", "rule": "No método indireto, parte-se do lucro e ajustam-se itens sem efeito de caixa, além das variações operacionais e itens de investimento/financiamento. Depreciação é despesa sem saída de caixa.", "diagram": "Lucro líquido 40.000 → + Depreciação 10.000 → 50.000 antes dos demais ajustes operacionais", "example": "DRE: receita 100.000 − despesas pagas 50.000 − depreciação 10.000 = lucro 40.000. Caixa operacional, supondo tudo recebido e pago, é 50.000. Somar depreciação não cria dinheiro: desfaz efeito contábil.", "wrong": "A: aquisição a prazo sem caixa não é fluxo; B: resgate pode ser investimento ou operacional conforme natureza, não ajuste pelo valor integral; C: integralização em bens não gera caixa; E: pagamento em imóveis não gera caixa.", "tip": "Depreciação reduziu lucro, mas não caixa: some de volta."}, {"n": 18, "t": "Demonstração Do Valor Adicionado", "q": "De acordo com a NBC TG 09– Demonstração do Valor Adicionado, o seguinte item deve ser contabilizado como Outras Receitas, em Valor Adicionado Recebido em Transferência:", "opts": ["Receitas financeiras.", "Ativo construído para uso próprio.", "Venda de ativo imobilizado com lucro.", "Resultado de equivalência patrimonial.", "Dividendos relativos a investimentos avaliados ao custo."], "g": "E", "rule": "Na DVA, dividendos de investimentos avaliados ao custo integram outras receitas no valor adicionado recebido em transferência. Não confunda com dividendos pagos aos próprios acionistas.", "diagram": "Riqueza produzida pela entidade → + Valor recebido em transferência: MEP | Receitas financeiras | Outras (dividendos ao custo) → Riqueza total a distribuir", "example": "Valor produzido líquido 80.000 + MEP 10.000 + receitas financeiras 5.000 + dividendos ao custo 3.000 = 98.000 de valor total a distribuir. Os 3.000 entram em outras receitas recebidas em transferência.", "wrong": "A: rubrica própria de receitas financeiras; B: receita de construção de ativos próprios; C: outras receitas na riqueza produzida, não recebida em transferência; D: rubrica própria de equivalência patrimonial.", "tip": "Dividendos recebidos ao custo: outras receitas em transferência."}, {"n": 19, "t": "Reservas De Lucros", "q": "O estatuto de uma sociedade empresária previa, anualmente, a constituição de uma reserva com o intuito de segregar uma parcela dos lucros, correspondente a prováveis perdas extraordinárias futuras. Ao final de cada exercício, a sociedade empresária deveria constituir reserva", "opts": ["legal.", "estatutária.", "para retenção.", "para contingências.", "de lucros a realizar."], "g": "D", "rule": "Reserva para contingências destina parcela do lucro a compensar redução futura decorrente de perda julgada provável e estimável, conforme art. 195 da Lei 6.404. É destinação do lucro, não provisão.", "diagram": "Lucro 100.000 → Reserva para contingências 20.000 → PL permanece igual → Reversão quando cessar a razão ou ocorrer a perda", "example": "D: Lucros acumulados 20.000; C: Reserva para contingências 20.000. A constituição não reduz o PL total nem é despesa. Uma obrigação presente provável, por outro lado, pode exigir provisão no passivo.", "wrong": "A: legal tem finalidade de proteção do capital; B: estatutária tem finalidade definida no estatuto, mas a descrição específica é contingência; C: retenção atende orçamento de capital; E: lucros a realizar tratam da realização financeira do lucro.", "tip": "Perda futura extraordinária: reserva para contingências; obrigação presente: provisão."}, {"n": 20, "t": "Dividendos", "q": "O valor dos dividendos calculados e ainda não pagos será evidenciado na demonstração", "opts": ["do resultado do exercício.", "das mutações do ><div class="progress"><div style="width:${done*5}%"></div></div><p class="muted">Escolha um assunto. Cada questão tem uma tela exclusiva de resolução.</p><button class="primary" onclick="show(${Math.min(38,Math.max(0,Q.findIndex((q,i)=>state.a[i]===undefined)*2))})">Começar / continuar</button></div><div class="index">${Q.map((q,i)=>`<button onclick="show(${i*2})"><span class="num">${q.n}</span>${esc(q.t)} ${state.a[i]===undefined?'':state.a[i]===q.g?'✓':'✗'}</button>`).join('')}</div><p><button onclick="reset()">Reiniciar estudo</button></p>`;return}if(p===40){app.innerHTML=`<div class="hero"><h1>Revisão concluída</h1><strong>${score} acertos de 20</strong><p>${done} respondidas</p></div><div class="panel"><h2>Gabarito</h2>${Q.map((q,i)=>`<p><button onclick="show(${i*2+1})">${q.n} — ${q.g} · ${state.a[i]===undefined?'Não respondida':state.a[i]===q.g?'Acertou':'Revisar'}</button></p>`).join('')}</div>`;return}let i=Math.floor(p/2),q=Q[i],a=state.a[i],res=p%2;app.innerHTML=`<div class="tag">FGV • QUESTÃO ${String(q.n).padStart(2,'0')} / 20</div><div class="progress"><div style="width:${(p+1)/40*100}%"></div></div><h2>${esc(q.t)}</h2>`+(res?`<div class="answer">GABARITO: ${q.g}) ${esc(q.opts[q.g.charCodeAt(0)-65])}</div><h2>Resolução do Professor Moreira</h2><section class="panel"><h3>1. Entenda o conceito</h3>${esc(q.rule)}</section><section class="panel paper"><h3>2. Visualize a situação</h3><div class="diagram">${q.diagram.split('→').map((x,j)=>`${j?'<div class="arrow">↓</div>':''}<div class="node">${esc(x.trim())}</div>`).join('')}</div></section><section class="panel paper"><h3>3. Aplicação prática</h3>${esc(q.example)}</section><section class="panel"><h3>4. Por que as demais estão erradas?</h3>${q.wrong.split(/; |\. (?=[A-E](?: e |:))/).map(x=>`<div class="wrongline">${esc(x)}</div>`).join('')}</section><section class="panel tip"><h3>5. Leve para a prova</h3><b>${esc(q.tip)}</b></section><button class="primary" onclick="go(1)">${i===19?'Ver desempenho':'Próxima questão'} ›</button>`:`<section class="panel"><div class="tag">ENUNCIADO ORIGINAL</div><p>${esc(q.q)}</p>${q.opts.map((o,j)=>{let l='ABCDE'[j];return `<button class="opt ${a!==undefined?(l===q.g?'right':l===a?'wrong':''):''}" onclick="choose('${l}')">${l}) ${esc(o)}</button>`}).join('')}${a!==undefined?`<p><b>${a===q.g?'✓ Resposta correta!':'✗ Revise a explicação.'}</b></p>`:''}<button class="primary" onclick="go(1)">Ver resolução completa ›</button></section>`)}render();</script></html>
